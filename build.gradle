plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}
version = mod_version
group = 'com.raishxn.modernspace'
base { archivesName = 'modernspace' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
// GregTech (GTO fork) bridge: Java 21 classes, loaded only when that GTCEu build is present.
sourceSets {
    gto {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}
legacyForge {
    version = '1.20.1-47.4.20'
    mods { modernspace { sourceSet sourceSets.main; sourceSet sourceSets.gto } }
    runs {
        client { client() }
        server { server() }
        // Server on a copy of an old GTNA world (run-migtest/world) to exercise the GTNA import.
        migrationTestServer {
            server()
            gameDirectory = project.file('run-migtest')
            programArguments.add('--nogui')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty('forge.enabledGameTestNamespaces', 'modernspace')
        }
    }
}
mixin {
    add sourceSets.main, 'modernspace.refmap.json'
    config 'modernspace.mixins.json'
    config 'modernspace.compat.mixins.json'
}
repositories {
    // GTO 0.6.0-dev30 jars (GTO fork of GTCEu, not on a public maven); compile-only.
    flatDir { dirs 'libs' }
    mavenCentral()
    maven {
        name = 'Commoble'
        url = 'https://maven.commoble.net/'
        content { includeGroup 'commoble.infiniverse' }
    }
}
dependencies {
    modImplementation('commoble.infiniverse:infiniverse-1.20.1:1.0.0.5') { transitive = false }
    modCompileOnly 'dev:gtceu:26.11.26'
    modCompileOnly 'dev:ldlib:1.0.52.a'
    modCompileOnly 'dev:datasynclib:26.11.2'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.named('compileGtoJava') {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.release = 21
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
jar {
    from sourceSets.gto.output
    manifest.attributes('MixinConfigs': 'modernspace.mixins.json,modernspace.compat.mixins.json')
    from(project.files('LICENSE', 'COPYING', 'THIRD_PARTY_NOTICES.md')) { into 'META-INF' }
}
